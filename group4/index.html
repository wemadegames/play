<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Fusion</title>
<style>
  :root{ --bg:#0a1410; --panel:#12241b; --text:#eafff2; --muted:#8fb7a2; --buf:#2b6cff; --eag:#3ad06a; --accent:#ffd23f; --border:#1f3a2c; }
  *{ box-sizing:border-box; }
  [hidden]{ display:none!important; }
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:14px;
    background:var(--bg); color:var(--text); font-family:ui-monospace,Menlo,Consolas,monospace; }

  /* field flanked by two scoreboards */
  .arena{ display:flex; align-items:center; justify-content:center; gap:12px; width:100%; }
  .board{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 12px; min-width:70px;
    border:1px solid var(--border); border-radius:10px; background:var(--panel); }
  .board-lbl{ font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); }
  .board-num{ font-size:34px; font-weight:700; color:var(--accent); }

  .wrap{ width:100%; max-width:380px; display:flex; flex-direction:column; gap:10px; }
  .back{ align-self:flex-start; display:inline-flex; align-items:center; gap:6px; padding:10px 14px; min-height:44px;
    font-size:12px; text-decoration:none; color:var(--muted);
    border:1px solid var(--border); border-radius:8px; background:var(--panel); }
  .back:hover{ color:var(--text); border-color:var(--muted); }
  .hud{ display:flex; justify-content:space-between; font-size:12px; }
  .hud b{ color:var(--accent); } .buf{ color:var(--buf); } .eag{ color:var(--eag); }
  #msg{ text-align:center; font-size:13px; min-height:18px; color:var(--accent); }
  .stage{ position:relative; border:2px solid var(--border); border-radius:10px; overflow:hidden; background:#0c1a13; }
  canvas{ display:block; width:100%; height:auto; image-rendering:pixelated; touch-action:none; }
  .overlay{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; padding:20px; text-align:center; background:rgba(6,14,10,.92); }
  .overlay.hidden{ display:none; }
  .overlay h1{ margin:0; font-size:20px; } .overlay p{ margin:0; font-size:13px; color:var(--muted); max-width:30ch; line-height:1.5; }
  .btn{ margin-top:4px; padding:11px 24px; min-height:44px; border:none; border-radius:8px; background:var(--accent);
    color:#231a00; font-weight:700; font-size:15px; font-family:inherit; cursor:pointer; }
  .foot{ font-size:12px; color:var(--muted); text-align:center; line-height:1.5; }
  .ctl{ display:flex; flex-wrap:wrap; gap:4px 14px; justify-content:center; font-size:12px; color:var(--muted); }
  .ctl b{ color:var(--text); font-weight:600; }
  .hint{ margin:0; font-size:11px; color:var(--muted); }
  .save{ display:flex; gap:8px; width:100%; max-width:300px; }
  .save input{ flex:1; min-width:0; min-height:44px; padding:9px 10px; border:1px solid var(--border); border-radius:8px;
    background:var(--panel); color:var(--text); font-family:inherit; font-size:14px; }
  .btn2{ padding:0 16px; min-height:44px; border:none; border-radius:8px; background:var(--accent); color:#231a00;
    font-weight:700; font-family:inherit; font-size:14px; cursor:pointer; }
  .btn2:disabled{ opacity:.5; }
  .lb{ width:100%; max-width:240px; font-size:12px; text-align:left; }
  .lbh{ text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:4px; }
  .lbrow{ display:flex; justify-content:space-between; padding:3px 0; border-top:1px solid var(--border); }
  .lbrow.empty{ justify-content:center; color:var(--muted); }
  .skip{ padding:0 12px; min-height:44px; border:1px solid var(--border); border-radius:8px; background:transparent;
    color:var(--muted); font-family:inherit; font-size:13px; cursor:pointer; }

  /* on-screen touch controls (phones), swap by game phase */
  .touch{ display:flex; flex-direction:column; align-items:center; gap:8px; }
  .tgroup{ display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; }
  .tgroup.run{ flex-direction:column; }
  .touch button{ min-height:48px; min-width:64px; padding:10px 14px; border:1px solid var(--border);
    border-radius:8px; background:var(--panel); color:var(--text); font-family:inherit; font-size:15px; cursor:pointer; }
  .touch .big{ background:var(--accent); color:#231a00; font-weight:700; min-width:130px; }
  .dpad{ display:grid; grid-template-columns:repeat(3,50px); grid-template-rows:repeat(2,50px); gap:6px; }
  .dpad button{ min-width:0; font-size:18px; }
  .dpad button:nth-child(1){ grid-column:2; grid-row:1; }
  .dpad button:nth-child(2){ grid-column:1; grid-row:2; }
  .dpad button:nth-child(3){ grid-column:2; grid-row:2; }
  .dpad button:nth-child(4){ grid-column:3; grid-row:2; }

  /* mobile: side boards drop away, the top HUD keeps the score */
  @media(max-width:768px){ .board{ display:none; } }
  @media(min-width:769px){ .touch{ display:none; } }
</style>
</head>
<body>
<div class="arena">
  <aside class="board"><span class="board-lbl">Buffalo</span><span class="board-num" id="scoreL">0</span></aside>
  <div class="wrap">
    <a class="back" href="../index.html">&larr; Arcade</a>
    <div class="hud"><span><span class="buf">Buffalo</span> vs <span class="eag">Eagles</span></span><span>Score <b id="score">0</b></span><span>Heat <b id="heat">1</b></span></div>
    <div id="msg">Set your power, then press F to throw</div>
    <div class="stage">
      <canvas id="game"></canvas>
      <div id="overlay" class="overlay hidden">
        <h1>Football Fusion</h1>
        <p></p>
        <div id="saveRow" class="save" hidden>
          <input id="nameIn" maxlength="8" placeholder="Top 5! Name" aria-label="Your name for the top 5">
          <button id="saveBtn" class="btn2">Save</button>
          <button id="skipBtn" class="skip">Skip</button>
        </div>
        <p id="saveHint" class="hint" hidden>Enter saves &middot; Esc skips</p>
        <div id="lbPanel" class="lb"></div>
        <button id="start" class="btn">Play again</button>
        <p class="hint">&hellip;or press Enter</p>
      </div>
    </div>
    <div class="touch" id="touch">
      <div class="tgroup" data-phase="throw" hidden>
        <button data-k="q">&minus; Power</button>
        <button data-k="r">&plus; Power</button>
        <button class="big" data-k="f">Throw</button>
      </div>
      <div class="tgroup" data-phase="ball" hidden>
        <button class="big" data-k="f">Catch</button>
      </div>
      <div class="tgroup run" data-phase="run" hidden>
        <div class="dpad">
          <button data-move="w">▲</button><button data-move="a">◀</button>
          <button data-move="s">▼</button><button data-move="d">▶</button>
        </div>
        <button class="big" data-k="t">Tackle</button>
      </div>
      <div class="tgroup" data-phase="extra" hidden>
        <button class="big" data-k="k">Kick</button>
      </div>
    </div>
    <p class="foot"><b>Power</b> R/Q &middot; <b>Throw &amp; catch</b> F &middot; <b>Run</b> WASD &middot; <b>Tackle</b> T &middot; <b>Kick</b> K &middot; TD = 6, get tackled and the game ends</p>
  </div>
  <aside class="board"><span class="board-lbl">Score</span><span class="board-num" id="scoreR">0</span></aside>
</div>

<script>
/* ===== Football Fusion (Group 4) — schematic football ===== */
const W=340, H=640, EZ=56;            // bigger field + end zone height (top)
const RUN=2.4, DEF=2.5;               // player run speed vs faster Eagles
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
cv.width=W; cv.height=H; ctx.imageSmoothingEnabled=false;
const el=id=>document.getElementById(id);

// ---- leaderboard (saved on this device) ----
const LB='lb_footballfusion';
function getLB(){ try{ return JSON.parse(localStorage.getItem(LB))||[]; }catch(e){ return []; } }
function addScore(name,sc){ const a=getLB(); a.push({name:(name||'YOU').slice(0,8), score:sc});
  a.sort((x,y)=>y.score-x.score); a.splice(5); try{ localStorage.setItem(LB,JSON.stringify(a)); }catch(e){} return a; }
function renderLB(){ const a=getLB();
  el('lbPanel').innerHTML = '<div class="lbh">Top scores</div>' +
    (a.length ? a.map((r,i)=>`<div class="lbrow"><span>${i+1}. ${r.name}</span><span>${r.score}</span></div>`).join('')
              : '<div class="lbrow empty">No scores yet. Be the first.</div>'); }
let pendingScore=0, saved=false;
const fitsTop5 = sc => { const a=getLB(); return sc>0 && (a.length<5 || sc>a[a.length-1].score); };
function closeSave(){ el('saveRow').hidden=true; el('saveHint').hidden=true; el('nameIn').blur(); }
const nextPlay = (t) => { msg(t+' Next play...'); setTimeout(()=>newPlay(true), 1200); };  // no menu between plays
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

let state='menu', power=80, score=0, tackleCd=0, last=0, wantCatch=false, explodeUntil=0, defSpeed=DEF, heat=1;
let qb, wr, ball, defs, line, mates, particles=[];

const makeDefs = () => [
  {x:70,y:H-270,stunUntil:0}, {x:170,y:H-320,stunUntil:0},
  {x:270,y:H-270,stunUntil:0}, {x:170,y:H-200,stunUntil:0}
];
// more of our team on the field: blockers and receivers downfield
const makeMates = () => [
  {x:60,y:H-330}, {x:W-60,y:H-350}, {x:W/2,y:H-410}, {x:110,y:H-470}, {x:W-110,y:H-500}
];

function newPlay(keepScore){
  if(!keepScore){ score=0; defSpeed=DEF; heat=1; el('heat').textContent=heat; }
  closeSave();
  state='throw'; power=80; tackleCd=0; wantCatch=false;
  qb={x:W/2, y:H-46};
  wr={x:W/2, y:H-92};
  ball={x:qb.x, y:qb.y, t:0, live:false, from:null, to:null};
  defs=makeDefs(); mates=makeMates(); particles=[];
  line=[]; for(let i=0;i<10;i++) line.push({x:24+i*34, y:H-24});   // Buffalo line (decor)
  el('overlay').classList.add('hidden');
  setScore();
  msg('Set power with R/Q, press F to throw');
}
const msg = t => el('msg').textContent=t;
function setScore(){ const s=''+score; el('score').textContent=s; el('scoreL').textContent=s; el('scoreR').textContent=s; }
const over = (title,text,btn)=>{ const o=el('overlay'); o.classList.remove('hidden');
  o.querySelector('h1').textContent=title; o.querySelector('p').textContent=text; el('start').textContent=btn;
  pendingScore=score; saved=false; el('saveBtn').disabled=false; el('saveBtn').textContent='Save';
  el('nameIn').disabled=false; el('nameIn').value='';
  const top=fitsTop5(pendingScore); el('saveRow').hidden=!top; el('saveHint').hidden=!top; renderLB();
  if(top && !matchMedia('(pointer:coarse)').matches) el('nameIn').focus(); };

const lead = () => (power-65)/15*100 + 80;    // higher power throws deeper

function throwBall(){
  ball.from={x:qb.x,y:qb.y};
  ball.to={x:wr.x, y:Math.max(EZ+20, wr.y-lead())};
  ball.t=0; ball.live=true; state='ball'; wantCatch=false;
  msg('Here comes the ball. Tap F to catch!');
}

function explode(){                            // you get tackled = you explode
  particles=[];
  for(let i=0;i<22;i++){ const a=Math.random()*Math.PI*2, sp=50+Math.random()*120;
    particles.push({x:wr.x, y:wr.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:0.9, col:Math.random()<0.5?'#ff5a2a':'#ffd23f'}); }
  state='explode'; explodeUntil=performance.now()+900; msg('BOOM! You got tackled.');
}

function key(k){
  if(state==='throw'){
    if(k==='r') power=Math.min(80,power+3);
    else if(k==='q') power=Math.max(65,power-3);
    else if(k==='f') throwBall();
  } else if(state==='ball'){
    if(k==='f') wantCatch=true;
  } else if(state==='run'){
    if(k==='t'){ const now=performance.now();
      if(now>tackleCd){ const n=defs.slice().sort((a,b)=>dist(a,wr)-dist(b,wr))[0];
        if(n && dist(n,wr)<55){ const dx=n.x-wr.x, dy=n.y-wr.y, m=Math.hypot(dx,dy)||1;
          n.x+=dx/m*34; n.y+=dy/m*34; n.stunUntil=now+2500; tackleCd=now+900; msg('Tackle! An Eagle is down.'); }
        else msg('No one close enough to tackle.'); } }
  } else if(state==='extra'){
    if(k==='k'){ if(Math.random()<0.8){ score++; setScore(); msg('The kick is GOOD! +1'); } else msg('The kick sails wide.');
      state='done'; setTimeout(()=>nextPlay('Score: '+score+'.'),500); }
  }
}
const MOVE={w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],arrowup:[0,-1],arrowdown:[0,1],arrowleft:[-1,0],arrowright:[1,0]};
addEventListener('keydown',e=>{
  if(e.target && e.target.tagName==='INPUT') return;
  if(!el('overlay').classList.contains('hidden') && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); el('start').click(); return; }
  const k=e.key.toLowerCase(); if(k===' '){e.preventDefault();} if(k in MOVE||['r','q','f','t','k'].includes(k)){ e.preventDefault(); key(k); } });
el('saveBtn').addEventListener('click', ()=>{ if(saved) return; addScore(el('nameIn').value.trim(), pendingScore);
  saved=true; closeSave(); renderLB(); });
el('skipBtn').addEventListener('click', closeSave);
el('nameIn').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); el('saveBtn').click(); }
  else if(e.key==='Escape'){ e.preventDefault(); closeSave(); } e.stopPropagation(); });

function update(dt){
  if(state==='throw'){ wr.y-=1.4; wr.x+=Math.sin(performance.now()/300)*0.6; }
  else if(state==='ball'){
    ball.t=Math.min(1, ball.t+dt*1.15);
    wr.x+=(ball.to.x-wr.x)*0.08; wr.y+=(ball.to.y-wr.y)*0.08;
    if(ball.t>=1){
      if(wantCatch && dist(wr,ball.to)<34){ state='run'; msg('CAUGHT! Run to the end zone (WASD).'); }
      else { state='done'; nextPlay('Incomplete.'); }
    }
  }
  else if(state==='run'){
    const now=performance.now();
    keysHeld.forEach(k=>{ const m=MOVE[k]; if(m){ wr.x+=m[0]*RUN; wr.y+=m[1]*RUN; } });
    wr.x=Math.max(8,Math.min(W-8,wr.x)); wr.y=Math.max(EZ-6,Math.min(H-8,wr.y));
    for(const d of defs){ if(now<d.stunUntil) continue;                 // tackled defenders stay down
      const dx=wr.x-d.x, dy=wr.y-d.y, m=Math.hypot(dx,dy)||1; d.x+=dx/m*defSpeed; d.y+=dy/m*defSpeed;
      if(dist(d,wr)<13){ return explode(); } }
    if(wr.y<=EZ){ score+=6; setScore(); defSpeed=Math.min(DEF+1.6, defSpeed+0.2); heat++; el('heat').textContent=heat;
      state='extra'; msg('TOUCHDOWN! +6. The defenders get faster now. Press K for the extra point.'); }
  }
  else if(state==='explode'){
    for(const p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=40*dt; p.life-=dt; }
    if(performance.now()>explodeUntil){ state='done'; over('Tackled!','Game over. Final score: '+score+'.','Play again'); }
  }
}

// held keys for smooth running
const keysHeld=new Set();
addEventListener('keydown',e=>{ const k=e.key.toLowerCase(); if(k in MOVE) keysHeld.add(k); });
addEventListener('keyup',e=>{ keysHeld.delete(e.key.toLowerCase()); });

// touch controls: tap actions, hold the dpad to run, groups swap by phase
document.querySelectorAll('#touch [data-k]').forEach(b=>{ const k=b.dataset.k;
  const go=e=>{ e.preventDefault(); key(k); };
  b.addEventListener('touchstart',go,{passive:false}); b.addEventListener('click',go); });
document.querySelectorAll('#touch [data-move]').forEach(b=>{ const k=b.dataset.move;
  const dn=e=>{ e.preventDefault(); keysHeld.add(k); }, up=e=>{ e.preventDefault(); keysHeld.delete(k); };
  b.addEventListener('touchstart',dn,{passive:false}); b.addEventListener('touchend',up); b.addEventListener('touchcancel',up);
  b.addEventListener('mousedown',dn); b.addEventListener('mouseup',up); b.addEventListener('mouseleave',up); });
function syncControls(){ document.querySelectorAll('.tgroup').forEach(g=>{ g.hidden = g.dataset.phase!==state; }); }

function draw(){
  const now=performance.now();
  // field
  ctx.fillStyle='#123b25'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#0e2f1d'; ctx.fillRect(0,0,W,EZ);            // end zone
  ctx.strokeStyle='#1f5c3a'; ctx.lineWidth=1;
  for(let y=EZ;y<H;y+=40){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  ctx.fillStyle='#3ad06a'; ctx.font='10px monospace'; ctx.textAlign='center'; ctx.fillText('END ZONE',W/2,EZ/2+3);

  for(const p of line){ ctx.fillStyle='#1c4b8a'; ctx.fillRect(p.x-4,p.y-4,8,8); }        // decor line
  for(const t of mates){ ctx.fillStyle='#2b6cff'; ctx.beginPath(); ctx.arc(t.x,t.y,6,0,7); ctx.fill(); } // teammates
  for(const d of defs){ ctx.fillStyle= now<d.stunUntil ? '#6b7d72' : '#3ad06a';          // stunned = grey
    ctx.beginPath(); ctx.arc(d.x,d.y,7,0,7); ctx.fill(); }

  if(state==='throw'||state==='menu'){ ctx.fillStyle='#2b6cff'; ctx.beginPath(); ctx.arc(qb.x,qb.y,8,0,7); ctx.fill(); }
  if(state!=='explode'){                                     // the receiver (gone once exploded)
    ctx.fillStyle='#5aa0ff'; ctx.beginPath(); ctx.arc(wr.x,wr.y,8,0,7); ctx.fill();
    if(state==='run'){ ctx.fillStyle='#8b5a2b'; ctx.beginPath(); ctx.ellipse(wr.x,wr.y-11,4,6,0,0,7); ctx.fill(); }
  }

  if(state==='ball'&&ball.live){ const t=ball.t, x=ball.from.x+(ball.to.x-ball.from.x)*t,
      y=ball.from.y+(ball.to.y-ball.from.y)*t - Math.sin(t*Math.PI)*40;
    ctx.fillStyle='#8b5a2b'; ctx.beginPath(); ctx.ellipse(x,y,4,7,0,0,7); ctx.fill(); }

  if(state==='explode'){ for(const p of particles){ if(p.life>0){ ctx.fillStyle=p.col; ctx.fillRect(p.x-2,p.y-2,4,4); } } }

  // power meter during throw
  if(state==='throw'){ const bx=20,by=H-20,bw=W-40;
    ctx.fillStyle='#08150e'; ctx.fillRect(bx,by,bw,10);
    ctx.fillStyle='#ffd23f'; ctx.fillRect(bx,by,bw*(power-60)/25,10);
    ctx.fillStyle='#eafff2'; ctx.textAlign='left'; ctx.fillText('POWER '+power,bx,by-4); }
}

function loop(ts){ const dt=Math.min(0.05,(ts-last)/1000); last=ts; if(state!=='menu') update(dt); draw(); syncControls(); requestAnimationFrame(loop); }
el('start').addEventListener('click',()=> newPlay(false));

// idle backdrop
qb={x:W/2,y:H-46}; wr={x:W/2,y:H-92}; ball={x:0,y:0,live:false}; defs=makeDefs(); mates=makeMates();
line=[]; for(let i=0;i<10;i++) line.push({x:24+i*34,y:H-24});
renderLB();
newPlay(false);                                  // straight into the first play, no menu
requestAnimationFrame(loop);
</script>
</body>
</html>
